name: Scheduled Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
    # Run weekly full test suite on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      test-suite:
        description: 'Test suite to run'
        required: true
        type: choice
        options:
          - all
          - unit
          - e2e
          - performance
          - security

jobs:
  # Daily regression tests
  daily-regression:
    name: Daily Regression Tests
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *' || github.event.inputs.test-suite == 'all'

    strategy:
      matrix:
        environment: [staging, production]
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          BASE_URL: ${{ matrix.environment == 'production' && 'https://beautify-github-profile.com' || 'https://staging.beautify-github-profile.com' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regression-${{ matrix.environment }}-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ Daily regression test failed
            Environment: ${{ matrix.environment }}
            Browser: ${{ matrix.browser }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Weekly comprehensive tests
  weekly-comprehensive:
    name: Weekly Comprehensive Tests
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * 0' || github.event.inputs.test-suite == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run test:all

      - name: Generate comprehensive report
        run: |
          mkdir -p reports
          npm run test:report
          cp -r coverage reports/
          cp -r playwright-report reports/

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v3
        with:
          name: weekly-comprehensive-report-${{ github.run_number }}
          path: reports/
          retention-days: 90

      - name: Generate test summary
        run: |
          cat > reports/summary.md << EOF
          # Weekly Test Report - $(date +%Y-%m-%d)

          ## Test Summary
          - **Date**: $(date)
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref }}

          ## Coverage
          $(cat coverage/coverage-summary.json | jq -r '.total | to_entries | .[] | "- \(.key): \(.value.pct)%"')

          ## Test Results
          - Unit Tests: $(cat test-results/*.json | jq '.numPassedTests')
          - E2E Tests: $(cat playwright-report/*.json | jq '.stats.expected')

          ## Issues Found
          See attached artifacts for detailed reports.
          EOF

      - name: Create GitHub Issue for weekly report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('reports/summary.md', 'utf8');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Test Report - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['automated', 'test-report', 'weekly']
            });

  # Performance benchmark tests
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 2 * * *' ||
      github.event.inputs.test-suite == 'performance' ||
      github.event.inputs.test-suite == 'all'

    strategy:
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse audit
        run: |
          lhci autorun \
            --collect.url=${{ matrix.environment == 'production' && 'https://beautify-github-profile.com' || 'https://staging.beautify-github-profile.com' }} \
            --collect.numberOfRuns=5

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-${{ matrix.environment }}-${{ github.run_number }}
          path: .lighthouseci/

      - name: Check performance thresholds
        run: |
          # Extract scores
          PERF_SCORE=$(cat .lighthouseci/lhr-*.json | jq '.categories.performance.score * 100' | head -1)
          A11Y_SCORE=$(cat .lighthouseci/lhr-*.json | jq '.categories.accessibility.score * 100' | head -1)

          echo "Performance: $PERF_SCORE"
          echo "Accessibility: $A11Y_SCORE"

          # Fail if below thresholds
          if (( $(echo "$PERF_SCORE < 90" | bc -l) )); then
            echo "❌ Performance score below 90"
            exit 1
          fi

          if (( $(echo "$A11Y_SCORE < 95" | bc -l) )); then
            echo "❌ Accessibility score below 95"
            exit 1
          fi

      - name: Run WebPageTest
        uses: WPO-Foundation/webpagetest-github-action@main
        with:
          apiKey: ${{ secrets.WPT_API_KEY }}
          urls: |
            ${{ matrix.environment == 'production' && 'https://beautify-github-profile.com' || 'https://staging.beautify-github-profile.com' }}
          settings: |
            {
              "location": "Dulles:Chrome",
              "runs": 3,
              "lighthouse": true,
              "video": true
            }
        continue-on-error: true

      - name: Notify on performance degradation
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ⚠️ Performance degradation detected
            Environment: ${{ matrix.environment }}
            Lighthouse report: Available in artifacts
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 2 * * *' ||
      github.event.inputs.test-suite == 'security' ||
      github.event.inputs.test-suite == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit.json || true
          cat npm-audit.json

      - name: Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --json-file-output=snyk-results.json
        continue-on-error: true

      - name: OWASP ZAP scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'https://beautify-github-profile.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-${{ github.run_number }}
          path: |
            npm-audit.json
            snyk-results.json
            trivy-results.sarif

      - name: Create security report issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let vulnerabilities = [];

            // Parse npm audit
            if (fs.existsSync('npm-audit.json')) {
              const npmAudit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
              vulnerabilities.push(`### npm audit\n- Critical: ${npmAudit.metadata.vulnerabilities.critical}\n- High: ${npmAudit.metadata.vulnerabilities.high}`);
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security Scan Alert - ${new Date().toISOString().split('T')[0]}`,
              body: `# Security Vulnerabilities Detected\n\n${vulnerabilities.join('\n\n')}\n\n**Action Required**: Review and address these vulnerabilities.\n\n[View Workflow](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['security', 'automated', 'urgent']
            });

  # Link checking
  link-checker:
    name: Link Checker
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * 0' || github.event.inputs.test-suite == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: |
            --verbose
            --no-progress
            --exclude-mail
            '**/*.md'
            '**/*.html'
          fail: true

      - name: Create issue on broken links
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔗 Broken Links Detected - ${new Date().toISOString().split('T')[0]}`,
              body: 'Automated link checking found broken links. Please review and fix.',
              labels: ['automated', 'documentation', 'broken-links']
            });

  # Test report summary
  test-summary:
    name: Generate Test Summary
    runs-on: ubuntu-latest
    needs:
      - daily-regression
      - performance-benchmark
      - security-scan
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate summary report
        run: |
          cat > summary.md << EOF
          # Scheduled Tests Summary - $(date +%Y-%m-%d)

          ## Test Results
          - Daily Regression: ${{ needs.daily-regression.result }}
          - Performance Benchmark: ${{ needs.performance-benchmark.result }}
          - Security Scan: ${{ needs.security-scan.result }}

          ## Artifacts
          All test artifacts have been uploaded and are available for 90 days.

          ## Next Steps
          $(if [ "${{ needs.daily-regression.result }}" == "failure" ] || [ "${{ needs.performance-benchmark.result }}" == "failure" ] || [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "- 🔴 Review failed tests and take corrective action"
          else
            echo "- ✅ All tests passed successfully"
          fi)
          EOF

          cat summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v3
        with:
          name: test-summary-${{ github.run_number }}
          path: summary.md

      - name: Notify team
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "📊 Scheduled Tests Complete",
              attachments: [{
                color: "${{ (needs.daily-regression.result == 'success' && needs.performance-benchmark.result == 'success' && needs.security-scan.result == 'success') && 'good' || 'danger' }}",
                fields: [{
                  title: "Regression Tests",
                  value: "${{ needs.daily-regression.result }}",
                  short: true
                }, {
                  title: "Performance",
                  value: "${{ needs.performance-benchmark.result }}",
                  short: true
                }, {
                  title: "Security",
                  value: "${{ needs.security-scan.result }}",
                  short: true
                }]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
